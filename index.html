async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn');

  try{await open_(pw);if(keep)try{localStorage.setItem(K,pw)}catch(_){}}

let saved=null; try{saved=localStorage.getItem(K)}catch(_){}
